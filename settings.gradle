// Victus Cloud mobile — Android build settings.
//
// :app is the Java single-activity WebView shell that produces the APK. Its web
// payload is bundled at app/src/main/assets/home.html; the React source in src/
// is the separate web build driven by Vite (bun run build).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'victus-cloud-mobile'
include ':app'
