# JVM args: keep CI builds fast and deterministic.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is used for splash screen, edge-to-edge, predictive back and WebView compat.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Treat only warnings as warnings; never fail CI on lint (lint runs as a separate report).
android.lint.options.abortOnError=false
