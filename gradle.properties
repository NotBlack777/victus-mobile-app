# AndroidX is required by the androidx.* dependencies declared in app/build.gradle
# (activity, core, core-splashscreen, webkit).
android.useAndroidX=true

# Namespaced, non-transitive R classes: each module only sees its own resources.
android.nonTransitiveRClass=true

# JVM for the Gradle/AGP build. AGP 8.7 requires Java 17.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# No lingering daemon: keeps sandbox/CI builds self-contained.
org.gradle.daemon=false
