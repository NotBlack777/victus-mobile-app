plugins {
    id 'base'
    // Android Gradle Plugin. Applied (not declared) by :app, which is the module
    // that actually produces the APK.
    id 'com.android.application' version '8.7.3' apply false
}

// `./gradlew assembleDebug` is the documented entry point: it now builds the
// real debug APK from :app at app/build/outputs/apk/debug/app-debug.apk.
tasks.register('assembleDebug') {
    group = 'build'
    description = 'Assembles the Victus Cloud debug APK.'
    dependsOn ':app:assembleDebug'
    doLast {
        println 'Debug APK: app/build/outputs/apk/debug/app-debug.apk'
    }
}
