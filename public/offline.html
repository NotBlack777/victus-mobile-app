<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>Victus Cloud — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 20% 0%, rgba(139, 92, 246, 0.14), transparent 26rem),
          #0a0a0f;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 340px;
        width: 100%;
        text-align: center;
        background: #12121a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 32px 24px;
      }
      .glyph {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(139, 92, 246, 0.12);
        border: 1px solid rgba(139, 92, 246, 0.3);
        font-size: 26px;
        color: #a78bfa;
      }
      h1 { font-size: 17px; margin: 0 0 6px; }
      p { font-size: 12.5px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        color: #fff;
        font-weight: 700;
        font-size: 13px;
        padding: 12px 22px;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glyph">▲</div>
      <h1>You're offline</h1>
      <p>Victus Cloud needs a connection to reach your servers, billing and drive. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
