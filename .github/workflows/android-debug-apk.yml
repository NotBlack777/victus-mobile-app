name: Android debug APK

# Builds the Android APK, publishes it as a workflow artifact, and — on a `v*`
# tag — attaches it to a GitHub Release. The in-app updater reads
# /repos/{owner}/{repo}/releases/latest, so a tagged release is what makes
# "Check for updates" find a new build.
#
# Signing: the APK is signed with the release keystore from repository secrets,
# not the runner's throwaway debug key. A stable signature is what lets Android
# install a new build over the installed one, and what satisfies the updater's
# same-signer check. See the "Release signing" section of app/build.gradle.
#
# Required repository secrets:
#   VICTUS_KEYSTORE_BASE64   base64 of release.keystore
#   VICTUS_STORE_PASSWORD    keystore password
#   VICTUS_KEY_ALIAS         key alias (victus-release)
#   VICTUS_KEY_PASSWORD      key password
# Without them the build still succeeds, but falls back to the runner's debug
# key — which changes on every run and cannot upgrade an existing install.

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: bun install

      - name: Ensure required Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Configure release signing
        env:
          VICTUS_KEYSTORE_BASE64: ${{ secrets.VICTUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$VICTUS_KEYSTORE_BASE64" ]; then
            echo "$VICTUS_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Release keystore restored for this build."
          else
            echo "::warning::VICTUS_KEYSTORE_BASE64 is not set. Falling back to the \
            runner's debug key, which differs on every run — the resulting APK \
            cannot be installed over an existing install and the in-app updater \
            will reject it."
          fi

      - name: Build APK and run updater unit tests
        env:
          VICTUS_KEYSTORE_FILE: release.keystore
          VICTUS_STORE_PASSWORD: ${{ secrets.VICTUS_STORE_PASSWORD }}
          VICTUS_KEY_ALIAS: ${{ secrets.VICTUS_KEY_ALIAS }}
          VICTUS_KEY_PASSWORD: ${{ secrets.VICTUS_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest --no-daemon --console=plain

      - name: Verify APK signature
        env:
          VICTUS_KEYSTORE_BASE64: ${{ secrets.VICTUS_KEYSTORE_BASE64 }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

          SIGNER=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate DN: //p')
          echo "Signer: $SIGNER"

          if [ -n "$VICTUS_KEYSTORE_BASE64" ] && ! printf '%s' "$SIGNER" | grep -q 'CN=Victus Cloud'; then
            echo "::error::Expected the release keystore's certificate (CN=Victus Cloud) but found: $SIGNER"
            exit 1
          fi

      - name: Report APK details
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILDTOOLS="$ANDROID_HOME/build-tools/35.0.0"
          {
            echo "### APK"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Path | \`$APK\` |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| Version | $("$BUILDTOOLS/aapt2" dump badging "$APK" | head -1 | sed -E "s/.*versionCode='([0-9]+)' versionName='([^']+)'.*/v\\1 (\\2)/") |"
            echo "| Signer | $("$BUILDTOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate DN: //p') |"
            echo "| Cert SHA-256 | \`$("$BUILDTOOLS/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: victus-cloud-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Note skipped release (tag without signing secrets)
        if: startsWith(github.ref, 'refs/tags/v') && secrets.VICTUS_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Tagged build was NOT published as a release. Add the \
          VICTUS_KEYSTORE_BASE64 / VICTUS_STORE_PASSWORD / VICTUS_KEY_ALIAS / \
          VICTUS_KEY_PASSWORD repository secrets so tagged builds are signed with \
          the stable release key and can upgrade an existing install."

      # Only publish when the release keystore is configured. An unsigned (or
      # runner-debug-signed) APK published as a release would be rejected by the
      # in-app updater and could not be installed over the current app, so it is
      # better to publish nothing than a build nobody can install.
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') && secrets.VICTUS_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          gh release create "$GITHUB_REF_NAME" \
            "$APK#victus-cloud-$GITHUB_REF_NAME.apk" \
            --title "Victus Cloud $GITHUB_REF_NAME" \
            --generate-notes
