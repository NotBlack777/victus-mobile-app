name: Build Debug APK

# Phone-only workflow: every push (any branch) builds a debug APK automatically,
# and it can also be started by hand from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a release on tag builds

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Stage APK with a friendly name
        run: cp app/build/outputs/apk/debug/app-debug.apk VictusCloud-debug.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VictusCloud-debug-apk
          path: VictusCloud-debug.apk
          retention-days: 90

      # Tag builds additionally publish the APK as a release asset, which makes
      # it downloadable from the phone without opening workflow-run pages.
      - name: Attach APK to GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: VictusCloud-debug.apk
          generate_release_notes: true
