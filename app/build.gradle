plugins {
    id 'com.android.application'
}

// ============================================================================
// Release signing
// ============================================================================
// Every build has to carry the *same* signature. Android refuses to install an
// APK whose signer differs from the installed copy (INSTALL_FAILED_UPDATE_
// INCOMPATIBLE), and UpdateInstaller.requireSameSigner() rejects it as well —
// so a build-to-build signature change silently breaks both manual upgrades and
// the in-app updater.
//
// GitHub's hosted runners regenerate ~/.android/debug.keystore on every run, so
// CI builds were signed with a fresh random key each time. Credentials now come
// from the environment (CI secrets) or keystore.properties (local, git-ignored).
// When neither is present the build still succeeds on the standard debug key,
// so forks and pull requests keep working.

def signingProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String envName, String propertyName ->
    String fromEnv = System.getenv(envName)
    if (fromEnv != null && !fromEnv.trim().isEmpty()) return fromEnv.trim()
    String fromProperties = signingProperties.getProperty(propertyName)
    if (fromProperties != null && !fromProperties.trim().isEmpty()) return fromProperties.trim()
    return null
}

def signingKeystorePath = signingValue('VICTUS_KEYSTORE_FILE', 'storeFile')
def signingKeystoreFile = signingKeystorePath ? rootProject.file(signingKeystorePath) : null
// Only treat the keystore as usable when the file is really there *and* the
// passwords resolve, so a half-configured environment degrades to debug
// signing instead of failing the build with a confusing parse error.
def hasReleaseSigning = signingKeystoreFile != null
        && signingKeystoreFile.exists()
        && signingValue('VICTUS_STORE_PASSWORD', 'storePassword') != null
        && signingValue('VICTUS_KEY_ALIAS', 'keyAlias') != null
        && signingValue('VICTUS_KEY_PASSWORD', 'keyPassword') != null

android {
    namespace 'com.victuscloud.ecosystem'
    // Current stable Android API level (Android 15). Edge-to-edge is enforced at 35+,
    // which this codebase handles properly via WindowInsets.
    compileSdk 35

    defaultConfig {
        applicationId 'com.victuscloud.ecosystem'
        // API 24 (Android 7.0). Raised from 23 because the Shizuku API used by the
        // in-app updater declares minSdk 24; forcing it onto 23 via
        // tools:overrideLibrary would risk NoClassDefFoundError crashes on
        // Android 6.0 instead of a clean "unsupported" path.
        minSdk 24
        targetSdk 35
        versionCode 57
        versionName '4.6.9'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile signingKeystoreFile
                storePassword signingValue('VICTUS_STORE_PASSWORD', 'storePassword')
                keyAlias signingValue('VICTUS_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('VICTUS_KEY_PASSWORD', 'keyPassword')
                // v1 + v2 so the APK installs on every supported API level.
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    // ========================================================================
    // NO SHRINKING. EVER.
    // ========================================================================
    // minifyEnabled / shrinkResources are hard-disabled for BOTH build types.
    //
    // This is a deliberate stability decision, not an oversight, and the original
    // diagnosis behind it turned out to be only half right. Shrinking did remove
    // all 30 `androidx.core.splashscreen` classes from the 4.5.0/4.5.1 release dex,
    // along with the `installSplashScreen` call that MainActivity.onCreate() makes
    // on the first line of launch — but that was NOT what was crashing the app. The
    // real cause was a re-parenting bug in createLayout() that killed every build
    // of every version, now covered by MainActivityLaunchTest. See CHANGELOG 4.6.1.
    //
    // Shrinking stays off regardless: a launch-path class vanishing under
    // minification is a genuine hazard even when it is not today's bug.
    //
    // APK size is not a goal here. Stability is. Nothing in this build is
    // shrunk, minified, obfuscated or stripped — not code, not resources, not
    // assets — and the `checkNoShrinking` task below fails the build if anyone
    // ever turns it back on.
    buildTypes {
        debug {
            // Debug builds keep the original applicationId so the phone-only
            // workflow produces an installable update path for testers, and
            // carry the release signature so they upgrade each other in place.
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // See above: stability beats size. No R8, no ProGuard, no resource
            // shrinking, no obfuscation.
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Shizuku API 13.1 requires core library desugaring at minSdk 23.
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        // AIDL is used by the privileged install service (IUpdateService), which
        // Shizuku runs as the shell/root identity for in-app updates.
        aidl true
    }

    // Robolectric needs the merged manifest, the real resources and the
    // compiled assets to boot MainActivity in a JVM test.
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

// ============================================================================
// Guard rail: the build fails if shrinking is ever switched back on.
// ============================================================================
tasks.register('checkNoShrinking') {
    group = 'verification'
    description = 'Fails if any build type re-enables minification or resource shrinking.'
    def buildFile = file('build.gradle')
    inputs.file(buildFile)
    outputs.upToDateWhen { false }
    doLast {
        // Comments explain *why* these switches are off, and quoting the old
        // values in a comment must not read as re-enabling them — so only
        // non-comment lines are inspected.
        def code = buildFile.readLines('UTF-8')
                .collect { it.replaceAll(/^\s*\/\/.*$/, '').replaceAll(/\/\*.*?\*\//, '') }
                .join('\n')
        // Assembled from fragments so that this guard cannot match its own
        // search terms and report itself as a violation.
        def minifySwitch = ['minify', 'Enabled'].join('')
        def shrinkSwitch = ['shrink', 'Resources'].join('')
        def rulesFile = ['pro' + 'guard', 'Files'].join('')
        def rulesTemplate = ['pro' + 'guard-android']
        def offenders = []
        if (code =~ /${minifySwitch}\s+true/) offenders << "${minifySwitch} true"
        if (code =~ /${shrinkSwitch}\s+true/) offenders << "${shrinkSwitch} true"
        if (code.contains(rulesFile)) offenders << rulesFile
        if (code.contains(rulesTemplate[0])) offenders << rulesTemplate[0]
        if (!offenders.isEmpty()) {
            throw new GradleException(
                    "Shrinking must stay off. It stripped launch-path classes in 4.5.0,\n" +
                    "and the app is now proven not to need a small build to stay stable.\n" +
                    "Found in app/build.gradle: " + offenders.join(', ') + "\n" +
                    "Every build type must keep ${minifySwitch} false and ${shrinkSwitch} false.")
        }
        logger.lifecycle('checkNoShrinking: OK — no minification, obfuscation or resource shrinking.')
    }
}
tasks.matching { it.name ==~ /^pre(Debug|Release)Build$/ }.configureEach {
    dependsOn 'checkNoShrinking'
}

dependencies {
    // Edge-to-edge + predictive back (OnBackPressedDispatcher) + insets helpers.
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    // Android 12+ splash screen API, backported to our minSdk.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // WebViewAssetLoader + WebSettingsCompat: current replacements for file:// hacks
    // and deprecated WebSettings flags.
    implementation 'androidx.webkit:webkit:1.12.1'

    // Pull-to-refresh on the WebView column (androidx.swiperefreshlayout, ~30KB).
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // In-app updater — Shizuku installs the update as the ADB/shell identity (or
    // root, when Sui/root is available) without any user-facing install prompt.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Plain JVM tests for the updater's pure logic (manifest parsing, version
    // comparison, install-command construction). org.json comes from the Android
    // SDK at runtime, so the real implementation is supplied for the test JVM.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    // Robolectric runs MainActivity.onCreate for real, against a stubbed
    // Android runtime. The app shipped four releases that died on the first
    // line of launch purely because nothing ever executed that method, so the
    // launch path is now a test rather than a thing we hope works.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}

// ============================================================================
// Bundled React application
// ============================================================================
// The APK ships the real React app (src/, built by Vite into dist/) as APK
// assets instead of the legacy hand-written home.html. MainActivity loads
// https://appassets.androidplatform.net/index.html and the whole asset tree is
// served from that domain root, so Vite's absolute /assets/*, /icons/* and
// /manifest.webmanifest URLs resolve without any bundler base-path override.

final reactDistDir = rootProject.layout.projectDirectory.dir('dist')
def stagedReactAssetsDir = layout.buildDirectory.dir('generated/reactAssets')

// 1. Build the web app with the project's own package manager (bun.lock + the
//    `build` script in package.json: tsc -b && vite build).
def buildReactApp = tasks.register('buildReactApp', Exec) {
    group = 'build'
    description = 'Builds the React web app into dist/ (`bun run build`).'
    workingDir rootProject.projectDir
    commandLine 'bun', 'run', 'build'
    inputs.files(
            fileTree(new File(rootProject.projectDir, 'src')),
            fileTree(new File(rootProject.projectDir, 'public')),
            new File(rootProject.projectDir, 'index.html'),
            new File(rootProject.projectDir, 'package.json'),
            new File(rootProject.projectDir, 'vite.config.ts'),
            new File(rootProject.projectDir, 'tsconfig.json')
    ).withPropertyName('reactSources')
    outputs.dir(reactDistDir).withPropertyName('reactDist')
}

// 2. Stage it as APK assets. Sync (not Copy) so hashed bundles from an older
//    Vite build are removed instead of accumulating in the APK.
def bundleReactApp = tasks.register('bundleReactApp', Sync) {
    group = 'build'
    description = 'Stages the built React app as APK assets.'
    dependsOn buildReactApp
    from reactDistDir
    into stagedReactAssetsDir
    doFirst {
        File entry = new File(reactDistDir.asFile, 'index.html')
        if (!entry.exists()) {
            throw new GradleException(
                    "React build output is missing: ${entry}\n" +
                    "Run `bun install` then `bun run build` (the buildReactApp task does this automatically).")
        }
    }
}

// 3. Feed the staged directory into the APK asset merge for every variant.
android.sourceSets.main.assets.srcDirs += stagedReactAssetsDir
tasks.matching {
    it.name == 'preBuild' || (it.name.startsWith('merge') && it.name.endsWith('Assets'))
}.configureEach {
    dependsOn bundleReactApp
}
